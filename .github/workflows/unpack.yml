name: unpack-site
on:
  push:
    paths:
      - 'site-part-*.zip'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site parts and commit
        run: |
          for z in site-part-*.zip; do unzip -oq "$z"; rm "$z"; done
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack site files"
          git push
